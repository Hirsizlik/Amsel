name: Create Release

on:
  push:
    branches: [ "github-actions" ]

jobs:
  create_release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d')"
      - name: Create release
        id: create_release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.date.outputs.date }}
          name: Release ${{ steps.date.outputs.date }}
          draft: true

  build:
    name: Build
    needs: create_release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - os: linux-x64
          - os: win-x64

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: |
        cd src/Amsel.Avalonia
        dotnet build --configuration Release
        dotnet publish -c Release -r ${{ matrix.config.os }} --output publish --self-contained true -p:TreatWarningsAsErrors=false 
    - name: Test
      run: |
        cd src/Amsel.Data.Tests
        dotnet test --no-restore
    - name: Publish
      run: dotnet publish 
    - name: Upload release assets
      uses: nanoufo/action-upload-artifacts-and-release-assets@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        path: publish/bin/Release/net10.0/${{ matrix.config.os }}/Amsel.Avalonia*
        upload-release-files: true
        release-upload-url: ${{ needs.create_release.outputs.upload_url }}
  
